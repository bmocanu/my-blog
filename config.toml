# See this for more options: https://github.com/not-matthias/apollo/blob/main/content/posts/configuration.md
# and this: https://github.com/not-matthias/apollo/blob/main/config.toml#L14

base_url = "https://bogdan.mocanu.ws"
title = "Bogdan's tech"
description = "Personal site of Bogdan Mocanu, software engineer and tech enthusiast"
build_search_index = true
generate_feeds = true
compile_sass = true
minify_html = true

theme = "apollo"

taxonomies = [{ name = "tags" }]

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_json"

[markdown]
highlight_code = true
highlight_theme = "css"
highlight_themes_css = [
    { theme = "ayu-dark", filename = "syntax-theme-dark.css" },
    { theme = "ayu-light", filename = "syntax-theme-light.css" },
]

[extra]
toc = true
use_cdn = false
favicon = "/icon/favicon.png"
theme = "toggle"              # light, dark, auto, toggle
logo = "site_logo.svg"
fancy_code = true
dynamic_note = true           # a note that can be toggled
mathjax = true
mathjax_dollar_inline_enable = true
repo_url = "https://github.com/bmocanu/my-blog"

fediverse = false    # author attribution
fediverse_creator = ""    # e.g. @user@instance

menu = [
    { name = "/posts", url = "/posts", weight = 1 },
    { name = "/projects", url = "/projects", weight = 2 },
    { name = "/about", url = "/about", weight = 3 },
    { name = "/tags", url = "/tags", weight = 4 },
]

socials = [
    { name = "x/twitter", url = "https://x.com/bmocanu", icon = "x-twitter" },
    { name = "bluesky", url = "https://bsky.app/profile/bmocanu.bsky.social", icon = "bluesky" },
    { name = "linkedin", url = "www.linkedin.com/in/bmocanu", icon = "linkedin" },
    { name = "substack", url = "https://substack.com/@bmocanu", icon = "substack" },
    { name = "github", url = "https://github.com/bmocanu", icon = "github" },
]

stylesheets = [
    "custom.css"    # at /static/custom.css
]

[extra.taxonomies]
sort_by = "page_count"         # e.g. name, page_count
reverse = true

